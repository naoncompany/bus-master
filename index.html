<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS-MASTER LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 환경 설정 (MANDATORY) ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bus-management-live-final';

        let students = [];
        let currentBus = "1";
        let currentDay = "월";
        let currentView = "pickup";
        let isDriverMode = false;
        let currentUser = null;

        // 사진 데이터 전수 내장 (명단이 비었을 때 이식용)
        const SNAPSHOT_DATA = [
            {"id":"w1","name":"이하니","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:56","dLoc":"아테라","contacts":[]},
            {"id":"w2","name":"이준일","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:57","dLoc":"수자인센트럴","contacts":[]},
            {"id":"w3","name":"안다온","bus":"1","day":"월","pTime":"14:03","pLoc":"수자인더퍼스트","dTime":"16:02","dLoc":"수자인더퍼스트","contacts":[]},
            {"id":"w4","name":"김재이","bus":"1","day":"월","pTime":"14:08","pLoc":"자래이","dTime":"15:46","dLoc":"자래이","contacts":[]},
            {"id":"w5","name":"심지안","bus":"1","day":"월","pTime":"14:08","pLoc":"자래이","dTime":"15:46","dLoc":"자래이","contacts":[]},
            {"id":"w6","name":"이혜라","bus":"1","day":"월","pTime":"14:08","pLoc":"자래이","dTime":"15:34","dLoc":"호반서문","contacts":[]},
            {"id":"w7","name":"김지인","bus":"1","day":"월","pTime":"14:12","pLoc":"푸르지오","dTime":"15:42","dLoc":"푸르지오","contacts":[]},
            {"id":"w8","name":"김영호","bus":"1","day":"월","pTime":"14:12","pLoc":"푸르지오(변경)","dTime":"15:40","dLoc":"더힐 남문","contacts":[]},
            {"id":"w9","name":"김리나","bus":"1","day":"월","pTime":"14:15","pLoc":"호반써밋서문","dTime":"15:34","dLoc":"쌀어묵공방","contacts":[]},
            {"id":"f1","name":"정세윤","bus":"2","day":"금","pTime":"14:02","pLoc":"17단지","dTime":"15:44","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-3350-2166"}]},
            {"id":"f2","name":"최우주","bus":"2","day":"금","pTime":"14:08","pLoc":"중흥S클래스","dTime":"15:39","dLoc":"중흥S클래스","contacts":[{"cat":"보호자","tel":"010-7359-0616"}]},
            {"id":"f15","name":"공유찬","bus":"2","day":"금","pTime":"16:00","pLoc":"위례솔초","dTime":"17:55","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-9384-1191"}]}
        ];

        // --- [Rule 3] Auth Before Queries ---
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('bus')) currentBus = params.get('bus');
            if (params.get('mode') === 'driver') isDriverMode = true;

            const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
            if(['월','화','수','목','금'].includes(today)) currentDay = today;

            if (isDriverMode) {
                document.body.classList.add('driver-mode');
                document.querySelectorAll('.admin-ui').forEach(el => el.style.display = 'none');
            }

            try {
                // 커스텀 토큰이 있으면 우선 사용, 없으면 익명 로그인
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (currentUser) {
                        // 인증 완료 후 데이터 구독 시작
                        startListening();
                    }
                });
            } catch (err) {
                console.error("Auth Failed:", err);
            }
        };

        // --- 실시간 데이터 구독 (Rule 1 준수) ---
        function startListening() {
            if (!currentUser) return;
            const studentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'students');
            onSnapshot(studentsCol, (snapshot) => {
                students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // 데이터 이식 버튼 표시 여부 제어
                const seedBtn = document.getElementById('seed-btn');
                if (seedBtn) {
                    seedBtn.style.display = (students.length === 0 && !isDriverMode) ? 'block' : 'none';
                }
                
                render();
            }, (err) => {
                console.error("Firestore Error:", err);
            });
        }

        // --- 데이터 조작 함수 ---
        window.saveStudent = async () => {
            if (!currentUser) return;
            const name = document.getElementById('f-name').value;
            if (!name) return;
            const id = document.getElementById('f-id').value || "id-" + Date.now();
            
            const contacts = [];
            ["보호자", "학생", "돌봄", "타학원"].forEach(cat => {
                const tel = document.getElementById(`tel-${cat}`).value;
                if (tel) contacts.push({ cat, tel });
            });

            const data = {
                id, name,
                bus: document.getElementById('f-bus').value,
                day: document.getElementById('f-day').value,
                pTime: document.getElementById('f-pTime').value,
                pLoc: document.getElementById('f-pLoc').value,
                dTime: document.getElementById('f-dTime').value,
                dLoc: document.getElementById('f-dLoc').value,
                contacts
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), data);
                closeModal();
            } catch (err) {
                console.error("저장 실패:", err);
            }
        };

        window.deleteStudent = async (id) => {
            if (!currentUser || !confirm("정말 삭제하시겠습니까?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
            } catch (err) {
                console.error("삭제 실패:", err);
            }
        };

        window.seedInitialData = async () => {
            if (!currentUser || students.length > 0) return;
            const batch = writeBatch(db);
            SNAPSHOT_DATA.forEach(s => {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id);
                batch.set(docRef, s);
            });
            try {
                await batch.commit();
            } catch (err) {
                console.error("초기 데이터 이식 실패:", err);
            }
        };

        // --- UI 렌더링 ---
        function render() {
            const list = document.getElementById('main-list');
            list.innerHTML = '';
            const filtered = students.filter(s => s.bus === currentBus && s.day.includes(currentDay))
                .sort((a, b) => (currentView === 'pickup' ? a.pTime : a.dTime || "99:99").localeCompare(currentView === 'pickup' ? b.pTime : b.dTime || "99:99"));

            filtered.forEach(s => {
                const time = currentView === 'pickup' ? s.pTime : s.dTime;
                const loc = currentView === 'pickup' ? s.pLoc : s.dLoc;
                const accentClass = currentView === 'pickup' ? 'border-blue-500' : 'border-red-500';
                const textAccentClass = currentView === 'pickup' ? 'text-blue-600' : 'text-red-600';
                
                const card = document.createElement('div');
                card.className = `bg-white rounded-[2.5rem] shadow-xl border-l-[16px] ${accentClass} p-6 mb-4 animate-in fade-in slide-in-from-bottom-2`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h2 class="text-4xl font-black text-slate-900 tracking-tight">${s.name}</h2>
                            <p class="text-[10px] font-bold uppercase tracking-widest mt-1 ${textAccentClass}">${currentView === 'pickup' ? '🏠 승차단계' : '🏫 하차단계'}</p>
                        </div>
                        <div class="admin-ui flex gap-1 ${isDriverMode ? 'hidden' : ''}">
                            <button onclick="openEditModal('${s.id}')" class="p-2 text-slate-200">📝</button>
                            <button onclick="deleteStudent('${s.id}')" class="p-2 text-slate-200">🗑️</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-3xl mb-3 shadow-inner">
                        <span class="text-4xl font-black font-mono leading-none ${textAccentClass}">${time || '--:--'}</span>
                        <span class="text-xl font-bold text-slate-700 flex-1 break-keep">${loc || '장소 미입력'}</span>
                    </div>
                    <div class="space-y-2">
                        ${(s.contacts || []).map(c => `
                            <div class="flex items-center justify-between bg-slate-50/50 p-3 rounded-2xl border border-slate-100">
                                <span class="text-[9px] font-black text-slate-400 w-10 uppercase">${c.cat}</span>
                                <div class="flex gap-2">
                                    <a href="tel:${c.tel}" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md active:scale-90">📞 전화</a>
                                    <a href="sms:${c.tel}" class="bg-emerald-500 text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md active:scale-90">✉️ 문자</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                list.appendChild(card);
            });

            // UI Feedback
            document.getElementById('info-bus').innerText = currentBus + "호차";
            document.getElementById('info-day').innerText = currentDay + "요일";
            document.getElementById('info-count').innerText = filtered.length + " 명";
            document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('bg-yellow-400', b.innerText === currentDay));
            document.getElementById('btn-pickup').classList.toggle('active-tab', currentView === 'pickup');
            document.getElementById('btn-dropoff').classList.toggle('active-tab', currentView === 'dropoff');
        }

        // --- 유틸리티 ---
        window.setBus = (b) => { currentBus = b; render(); };
        window.setDay = (d) => { currentDay = d; render(); };
        window.setView = (v) => { currentView = v; render(); };
        window.openModal = () => { document.getElementById('f-id').value = ''; document.getElementById('modal-title').innerText = 'Add Student'; document.getElementById('student-form').reset(); document.getElementById('modal').style.display = 'flex'; };
        window.closeModal = () => document.getElementById('modal').style.display = 'none';
        window.openEditModal = (id) => {
            const s = students.find(item => item.id === id);
            if (!s) return;
            document.getElementById('f-id').value = s.id;
            document.getElementById('f-name').value = s.name;
            document.getElementById('f-bus').value = s.bus;
            document.getElementById('f-day').value = s.day;
            document.getElementById('f-pTime').value = s.pTime;
            document.getElementById('f-pLoc').value = s.pLoc;
            document.getElementById('f-dTime').value = s.dTime;
            document.getElementById('f-dLoc').value = s.dLoc;
            ["보호자", "학생", "돌봄", "타학원"].forEach(cat => {
                const c = (s.contacts || []).find(ci => ci.cat === cat);
                document.getElementById(`tel-${cat}`).value = c ? c.tel : '';
            });
            document.getElementById('modal-title').innerText = 'Edit Student';
            document.getElementById('modal').style.display = 'flex';
        };
        window.copyShareLink = (busNum) => {
            const url = `${window.location.origin}${window.location.pathname}?bus=${busNum}&mode=driver`;
            const t = document.createElement("textarea"); document.body.appendChild(t); t.value = url; t.select();
            document.execCommand('copy'); document.body.removeChild(t);
            alert(`${busNum}호차 기사용 링크가 복사되었습니다!`);
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-tab { background-color: white !important; color: #0f172a !important; border: 4px solid #facc15 !important; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transform: translateY(-2px); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 pb-40">
    <div id="app" class="max-w-xl mx-auto bg-white min-h-screen relative shadow-2xl">
        <header class="bg-slate-900 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
            <div class="flex justify-between items-center mb-5">
                <h1 class="text-xl font-black italic tracking-tighter">BUS-MASTER <span class="text-[10px] not-italic bg-blue-500 px-2 rounded">LIVE</span></h1>
                <div class="flex gap-2">
                    <button id="seed-btn" onclick="seedInitialData()" class="bg-emerald-500 text-white px-3 py-2 rounded-xl text-[10px] font-black shadow-lg hidden">사진데이터 이식</button>
                    <button onclick="openModal()" class="admin-ui bg-yellow-400 text-slate-900 px-4 py-2 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all">+ 학생 추가</button>
                </div>
            </div>
            <div id="admin-bus-selector" class="admin-ui grid grid-cols-3 gap-2 mb-5">
                <button onclick="setBus('1')" class="py-2 rounded-xl bg-slate-800 text-xs font-bold transition-all">1호차</button>
                <button onclick="setBus('2')" class="py-2 rounded-xl bg-slate-800 text-xs font-bold transition-all">2호차</button>
                <button onclick="setBus('3')" class="py-2 rounded-xl bg-slate-800 text-xs font-bold transition-all">3호차</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="setView('pickup')" id="btn-pickup" class="py-5 rounded-[2rem] bg-slate-800 text-slate-500 font-black text-lg flex flex-col items-center">🏠 승차 명단</button>
                <button onclick="setView('dropoff')" id="btn-dropoff" class="py-5 rounded-[2rem] bg-slate-800 text-slate-500 font-black text-lg flex flex-col items-center">🏫 하차 명단</button>
            </div>
        </header>

        <div class="flex gap-1 p-3 overflow-x-auto bg-white/90 no-scrollbar border-b sticky top-[215px] z-40">
            <button onclick="setDay('월')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">월</button>
            <button onclick="setDay('화')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">화</button>
            <button onclick="setDay('수')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">수</button>
            <button onclick="setDay('목')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">목</button>
            <button onclick="setDay('금')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">금</button>
        </div>

        <div class="px-6 py-5 flex justify-between items-end">
            <div>
                <span id="info-bus" class="text-3xl font-black text-slate-900 tracking-tighter">1호차</span>
                <span id="info-day" class="text-sm font-bold text-slate-400 ml-2 italic">요일</span>
            </div>
            <div id="info-count" class="bg-slate-900 text-white px-3 py-1 rounded-full text-[10px] font-black shadow-md">0명</div>
        </div>

        <main id="main-list" class="p-4 pb-20"></main>

        <footer id="admin-footer" class="admin-ui fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md border-t max-w-xl mx-auto flex gap-2 z-50 rounded-t-[3rem] shadow-2xl">
            <button onclick="copyShareLink('1')" class="flex-1 bg-slate-900 text-white py-4 rounded-3xl font-black text-[10px]">1호차 공유</button>
            <button onclick="copyShareLink('2')" class="flex-1 bg-slate-900 text-white py-4 rounded-3xl font-black text-[10px]">2호차 공유</button>
            <button onclick="copyShareLink('3')" class="flex-1 bg-slate-900 text-white py-4 rounded-3xl font-black text-[10px]">3호차 공유</button>
        </footer>

        <div id="modal" class="modal">
            <div class="bg-white w-[90%] max-w-md rounded-[3.5rem] overflow-hidden flex flex-col shadow-2xl max-h-[85vh]">
                <div class="p-8 bg-slate-900 text-white flex justify-between items-center sticky top-0">
                    <span id="modal-title" class="text-xl font-black italic tracking-tighter uppercase font-black uppercase">Add Student</span>
                    <button onclick="closeModal()" class="text-2xl">&times;</button>
                </div>
                <form id="student-form" class="p-8 space-y-5 overflow-y-auto pb-20 no-scrollbar">
                    <input type="hidden" id="f-id">
                    <input type="text" id="f-name" class="w-full p-5 bg-slate-100 rounded-3xl font-black text-xl outline-none" placeholder="학생 성함">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="f-bus" class="p-4 bg-slate-100 rounded-2xl font-bold border-none"><option value="1">1호차</option><option value="2">2호차</option><option value="3">3호차</option></select>
                        <select id="f-day" class="p-4 bg-slate-100 rounded-2xl font-bold border-none"><option value="월">월요일</option><option value="화">화요일</option><option value="수">수요일</option><option value="목">목요일</option><option value="금">금요일</option></select>
                    </div>
                    <div class="p-5 bg-blue-50 rounded-[2.5rem] space-y-2 border border-blue-100 shadow-inner">
                        <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest italic">🏠 Pickup</span>
                        <div class="flex gap-2">
                            <input type="time" id="f-pTime" class="w-2/5 p-3 rounded-xl font-black text-lg border-none shadow-md">
                            <input type="text" id="f-pLoc" class="w-3/5 p-3 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                        </div>
                    </div>
                    <div class="p-5 bg-red-50 rounded-[2.5rem] space-y-2 border border-red-100 shadow-inner">
                        <span class="text-[10px] font-black text-red-500 uppercase tracking-widest italic">🏫 Dropoff</span>
                        <div class="flex gap-2">
                            <input type="time" id="f-dTime" class="w-2/5 p-3 rounded-xl font-black text-lg border-none shadow-md">
                            <input type="text" id="f-dLoc" class="w-3/5 p-3 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <input type="tel" id="tel-보호자" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="보호자 번호">
                        <input type="tel" id="tel-학생" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="학생 번호">
                        <input type="tel" id="tel-돌봄" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="돌봄 번호">
                        <input type="tel" id="tel-타학원" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="타학원 번호">
                    </div>
                </form>
                <div class="p-8 bg-slate-50 border-t sticky bottom-0">
                    <button onclick="saveStudent()" class="w-full bg-slate-900 text-white py-5 rounded-[2.5rem] font-black text-lg shadow-xl active:scale-95 transition-all tracking-tighter italic">SAVE SCHEDULE</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
