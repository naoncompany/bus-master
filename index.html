<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS-MASTER LIVE</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto+Mono:wght@700&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
            user-select: none;
        }

        /* 탭 활성화 상태 (강조 효과) */
        .active-tab { 
            background-color: white !important; 
            color: #0f172a !important; 
            border: 4px solid #facc15 !important; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            transform: translateY(-2px); 
        }

        /* 모달 스타일 */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.9); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 1rem; 
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .pickup-card { border-left: 20px solid #3b82f6; }
        .dropoff-card { border-left: 20px solid #ef4444; }

        input, select, button { outline: none; -webkit-appearance: none; }
        
        /* 기사님 모드에서 관리자 도구 숨김 */
        body.driver-mode .admin-ui { display: none !important; }

        /* 시간 입력창 최적화: 모바일에서 잘림 방지 및 폰트 조정 */
        input[type="time"] {
            min-width: 140px; 
            font-size: 16px !important;
            padding: 8px !important;
            background-color: white !important;
        }
    </style>
</head>
<body class="pb-40 overflow-x-hidden">

<div id="app" class="max-w-xl mx-auto bg-white min-h-screen relative shadow-2xl">
    <!-- 1. 헤더 영역 -->
    <header class="bg-slate-900 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-2xl font-black italic tracking-tighter flex items-center gap-2">
                🚐 BUS-MASTER <span class="text-[10px] not-italic bg-blue-500 px-2 py-0.5 rounded font-bold uppercase">Live</span>
            </h1>
            <div class="admin-ui flex gap-2">
                <button id="seed-btn" onclick="dbActions.seed()" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-[10px] font-black shadow-lg hidden">📸 데이터 초기이식</button>
                <button onclick="ui.openAddModal()" class="bg-yellow-400 text-slate-900 px-4 py-2 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all">+ 학생 추가</button>
            </div>
        </div>

        <div id="admin-bus-selector" class="admin-ui grid grid-cols-3 gap-2 mb-5">
            <button onclick="changeBus('1')" id="bus-btn-1" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold transition-all">1호차</button>
            <button onclick="changeBus('2')" id="bus-btn-2" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold transition-all">2호차</button>
            <button onclick="changeBus('3')" id="bus-btn-3" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold transition-all">3호차</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="changeView('pickup')" id="btn-pickup" class="py-6 rounded-[2.5rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent transition-all">
                <span class="text-[10px] font-normal mb-1 opacity-50 uppercase tracking-widest">Academy Bound</span>🏠 승차 명단
            </button>
            <button onclick="changeView('dropoff')" id="btn-dropoff" class="py-6 rounded-[2.5rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent transition-all">
                <span class="text-[10px] font-normal mb-1 opacity-50 uppercase tracking-widest">Home Bound</span>🏫 하차 명단
            </button>
        </div>
    </header>

    <!-- 2. 요일 필터 -->
    <div id="day-selector" class="flex gap-1 p-3 overflow-x-auto bg-white/90 no-scrollbar border-b sticky top-[215px] z-40">
        <button onclick="changeDay('월')" class="day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">월</button>
        <button onclick="changeDay('화')" class="day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">화</button>
        <button onclick="changeDay('수')" class="day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">수</button>
        <button onclick="changeDay('목')" class="day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">목</button>
        <button onclick="changeDay('금')" class="day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">금</button>
    </div>

    <!-- 3. 정보 바 -->
    <div class="px-6 py-6 flex justify-between items-end italic text-left">
        <div class="flex flex-col">
            <span id="info-bus" class="text-4xl font-black text-slate-900 tracking-tighter leading-none">1호차</span>
            <span id="info-day" class="text-lg font-bold text-slate-400 mt-1 block italic">요일</span>
        </div>
        <div id="info-count" class="bg-slate-900 text-white px-4 py-1.5 rounded-full text-xs font-black shadow-lg">0명</div>
    </div>

    <!-- 4. 명단 영역 -->
    <main id="main-list" class="p-4 min-h-[400px]"></main>

    <!-- 5. 관리자 링크 복사 바 -->
    <footer id="admin-footer" class="admin-ui fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md border-t max-w-xl mx-auto flex gap-2 z-50 rounded-t-[3rem] shadow-2xl">
        <button onclick="copyLink('1')" id="cp-1" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">1호차 복사</button>
        <button onclick="copyLink('2')" id="cp-2" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">2호차 복사</button>
        <button onclick="copyLink('3')" id="cp-3" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">3호차 복사</button>
    </footer>

    <!-- 6. 모달: 학생 추가/수정 -->
    <div id="modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[4rem] overflow-hidden flex flex-col shadow-2xl max-h-[90vh]">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center sticky top-0 z-10 text-left">
                <span id="modal-title" class="text-xl font-black uppercase italic tracking-widest text-left">ADD STUDENT</span>
                <button onclick="closeModal()" class="text-4xl p-2">&times;</button>
            </div>
            <form id="student-form" class="p-8 space-y-6 overflow-y-auto no-scrollbar pb-10 text-left">
                <input type="hidden" id="f-id">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Student Name</label>
                    <input type="text" id="f-name" class="w-full p-5 bg-slate-100 rounded-3xl font-black text-xl outline-none shadow-inner" placeholder="학생 이름">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Bus</label>
                        <select id="f-bus" class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-none appearance-none shadow-md">
                            <option value="1">1호차</option><option value="2">2호차</option><option value="3">3호차</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Day</label>
                        <select id="f-day" class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-none appearance-none shadow-md">
                            <option value="월">월요일</option><option value="화">화요일</option><option value="수">수요일</option><option value="목">목요일</option><option value="금">금요일</option>
                        </select>
                    </div>
                </div>
                <div class="p-6 bg-blue-50 rounded-[2.5rem] space-y-2 border border-blue-100 shadow-inner">
                    <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest italic">🏠 Pickup (등원)</span>
                    <div class="flex gap-2 items-center">
                        <input type="time" id="f-pTime" class="w-[48%] p-3 rounded-xl font-bold border-none shadow-md">
                        <input type="text" id="f-pLoc" class="w-[52%] p-3 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                    </div>
                </div>
                <div class="p-5 bg-red-50 rounded-[2.5rem] space-y-2 border border-red-100 shadow-inner">
                    <span class="text-[10px] font-black text-red-500 uppercase tracking-widest italic">🏫 Dropoff (하원)</span>
                    <div class="flex gap-2 items-center">
                        <input type="time" id="f-dTime" class="w-[48%] p-3 rounded-xl font-bold border-none shadow-md">
                        <input type="text" id="f-dLoc" class="w-[52%] p-3 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Contacts</label>
                    <input type="tel" id="tel-보호자" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-xs" placeholder="보호자 번호">
                    <input type="tel" id="tel-학생" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-xs" placeholder="학생 번호">
                </div>
            </form>
            <div class="p-8 bg-slate-50 border-t sticky bottom-0 z-20">
                <button onclick="saveToCloud()" class="w-full bg-slate-900 text-white py-5 rounded-[2.5rem] font-black text-lg shadow-xl active:scale-95 italic">SAVE CHANGES</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase 배포 방어 로직 ---
    let firebaseConfig = { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
    try {
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        }
    } catch(e) {}
    
    // 설정값이 비어있으면 Firebase 초기화를 건너뛰어 에러 방지
    let db = null;
    let auth = null;
    let appId = 'bus-master-production-v10';
    
    if (firebaseConfig.apiKey) {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        appId = typeof __app_id !== 'undefined' ? __app_id : appId;
    }

    // 전역 상태
    window.state = {
        students: [],
        bus: "1",
        day: "월",
        view: "pickup",
        isDriver: false,
        user: null,
        setBus(b) { this.bus = b; renderUI(); },
        setDay(d) { this.day = d; renderUI(); },
        setView(v) { this.view = v; renderUI(); }
    };

    // 사진 데이터 내장
    const INITIAL_SNAPSHOT = [{"id":"w1","name":"이하니","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:56","dLoc":"아테라","contacts":[]},{"id":"f1","name":"정세윤","bus":"2","day":"금","pTime":"14:02","pLoc":"17단지","dTime":"15:44","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-3350-2166"}]}];

    async function start() {
        const params = new URLSearchParams(location.search);
        if (params.get('bus')) state.bus = params.get('bus');
        if (params.get('mode') === 'driver') state.isDriver = true;
        const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
        if(['월','화','수','목','금'].includes(today)) state.day = today;
        if (state.isDriver) document.body.classList.add('driver-mode');

        // 초기 렌더링 (DB 연결 전이라도 버튼은 작동하게 함)
        renderUI();

        if (!db) return; // Firebase 설정 없으면 여기서 중단 (UI는 계속 작동)

        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = user;
                    const col = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    onSnapshot(col, (snapshot) => {
                        state.students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        const seedBtn = document.getElementById('seed-btn');
                        if (seedBtn) seedBtn.style.display = (state.students.length === 0 && !state.isDriver) ? 'block' : 'none';
                        renderUI();
                    });
                }
            });
        } catch (e) { console.error("Firebase Sync Error", e); }
    }

    window.renderUI = function() {
        const listEl = document.getElementById('main-list');
        if (!listEl) return;
        listEl.innerHTML = '';
        const filtered = state.students.filter(s => s.bus === state.bus && s.day === state.day)
            .sort((a, b) => (state.view === 'pickup' ? a.pTime : a.dTime || "99:99").localeCompare(state.view === 'pickup' ? b.pTime : b.dTime || "99:99"));

        filtered.forEach(s => {
            const time = state.view === 'pickup' ? s.pTime : s.dTime;
            const loc = state.view === 'pickup' ? s.pLoc : s.dLoc;
            const colorClass = state.view === 'pickup' ? 'text-blue-600' : 'text-red-600';
            const accentClass = state.view === 'pickup' ? 'pickup-card' : 'dropoff-card';
            const card = document.createElement('div');
            card.className = `bg-white rounded-[3.5rem] shadow-xl ${accentClass} p-10 mb-8 text-left animate-in fade-in slide-in-from-bottom-5`;
            let contactsHTML = '';
            (s.contacts || []).forEach(c => {
                contactsHTML += `<div class="flex items-center justify-between bg-slate-50 p-5 rounded-[2.5rem] border border-slate-100 mt-4"><span class="text-[11px] font-black text-slate-400 uppercase w-16 text-center tracking-tighter">${c.cat}</span><div class="flex gap-3"><a href="tel:${c.tel}" class="bg-blue-600 text-white px-8 py-4 rounded-2xl text-[12px] font-black shadow-lg">📞 전화</a><a href="sms:${c.tel}" class="bg-emerald-500 text-white px-8 py-4 rounded-2xl text-[12px] font-black shadow-lg">✉️ 문자</a></div></div>`;
            });
            card.innerHTML = `<div class="flex justify-between items-start mb-6"><div><h2 class="text-6xl font-black text-slate-900 tracking-tighter">${s.name}</h2><p class="text-xs font-black uppercase tracking-[0.3em] mt-2 ${colorClass}">${state.view === 'pickup' ? '🏠 승차단계' : '🏫 하차단계'}</p></div>${!state.isDriver ? `<div class="flex gap-2 opacity-30"><button onclick="ui.openEditModal('${s.id}')" class="p-2 text-4xl">📝</button><button onclick="dbActions.deleteStudent('${s.id}')" class="p-2 text-4xl">🗑️</button></div>` : ''}</div><div class="flex items-center gap-6 bg-slate-50 p-8 rounded-[3.5rem] mb-6 shadow-inner border border-slate-100"><span class="text-7xl font-black font-mono tracking-tighter ${colorClass}">${time || '--:--'}</span><span class="text-4xl font-black text-slate-700 flex-1 break-keep leading-tight text-left">${loc || '장소 미입력'}</span></div><div class="space-y-2">${contactsHTML || '<p class="text-center text-slate-200 py-4 italic text-xs">No Contacts</p>'}</div>`;
            listEl.appendChild(card);
        });

        if (filtered.length === 0) listEl.innerHTML = `<div class="py-40 text-center opacity-10 text-2xl font-black italic uppercase tracking-widest">No Schedule Today</div>`;
        
        const iB = document.getElementById('info-bus'); if (iB) iB.innerText = state.bus + "호차";
        const iD = document.getElementById('info-day'); if (iD) iD.innerText = state.day + "요일 운행표";
        const iC = document.getElementById('info-count'); if (iC) iC.innerText = filtered.length + " 명";
        document.querySelectorAll('button').forEach(b => {
            if (b.innerText === state.day) b.classList.add('active-tab');
            else if (b.innerText.includes(state.bus) && b.classList.contains('bus-tab')) b.classList.add('active-tab');
            else b.classList.remove('active-tab');
        });
        const tP = document.getElementById('btn-pickup'); if (tP) tP.classList.toggle('active-tab', state.view === 'pickup');
        const tD = document.getElementById('btn-dropoff'); if (tD) tD.classList.toggle('active-tab', state.view === 'dropoff');
    };

    window.ui = {
        openAddModal() { const f = document.getElementById('student-form'); if (f) f.reset(); const i = document.getElementById('f-id'); if (i) i.value = ''; const m = document.getElementById('modal'); if (m) m.style.display = 'flex'; },
        openEditModal(id) {
            const s = state.students.find(item => item.id === id); if (!s) return;
            const fields = { 'f-id': s.id, 'f-name': s.name, 'f-bus': s.bus, 'f-day': s.day, 'f-pTime': s.pTime, 'f-pLoc': s.pLoc, 'f-dTime': s.dTime, 'f-dLoc': s.dLoc };
            Object.keys(fields).forEach(k => { const e = document.getElementById(k); if (e) e.value = fields[k]; });
            ["보호자", "학생"].forEach(cat => { const c = (s.contacts || []).find(ci => ci.cat === cat); const t = document.getElementById(`tel-${cat}`); if (t) t.value = c ? c.tel : ''; });
            const m = document.getElementById('modal'); if (m) m.style.display = 'flex';
        },
        closeModal() { const m = document.getElementById('modal'); if (m) m.style.display = 'none'; },
        copyLink(busNum) {
            const G_URL = "https://naoncompany.github.io/bus-master/";
            const link = `${G_URL}?bus=${busNum}&mode=driver`;
            const t = document.createElement("textarea"); document.body.appendChild(t); t.value = link; t.select(); t.setSelectionRange(0, 99999);
            document.execCommand('copy'); document.body.removeChild(t);
            const btn = document.getElementById(`cp-${busNum}`);
            if (btn) { const old = btn.innerText; btn.innerText = "COPIED! ✅"; btn.style.backgroundColor="#10b981"; setTimeout(() => { btn.innerText = old; btn.style.backgroundColor="#0f172a"; }, 2000); }
            alert(busNum + "호차 진짜 링크가 복사되었습니다!");
        }
    };

    window.dbActions = {
        async save() {
            if (!db) { alert("Firebase 설정이 없습니다."); return; }
            const n = document.getElementById('f-name'); if (!n || !n.value) return;
            const id = document.getElementById('f-id').value || "id-" + Date.now();
            const contacts = []; ["보호자", "학생"].forEach(cat => { const t = document.getElementById(`tel-${cat}`); if (t && t.value) contacts.push({ cat, tel: t.value }); });
            const data = { id, name: n.value, contacts, bus: document.getElementById('f-bus').value, day: document.getElementById('f-day').value, pTime: document.getElementById('f-pTime').value, pLoc: document.getElementById('f-pLoc').value, dTime: document.getElementById('f-dTime').value, dLoc: document.getElementById('f-dLoc').value };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), data);
            ui.closeModal();
        },
        async deleteStudent(id) { if (confirm("삭제할까요?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id)); },
        async seed() { const batch = writeBatch(db); INITIAL_SNAPSHOT.forEach(s => batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), s)); await batch.commit(); alert("이식 완료!"); }
    };

    window.changeBus = (b) => state.setBus(b);
    window.changeDay = (d) => state.setDay(d);
    window.changeView = (v) => state.setView(v);
    window.closeModal = ui.closeModal;
    window.copyLink = ui.copyLink;
    window.saveToCloud = window.dbActions.save;
    start();
</script>
</body>
</html>
