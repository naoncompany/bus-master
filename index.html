<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS-MASTER LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto+Mono:wght@700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .active-tab { background-color: white !important; color: #0f172a !important; border: 4px solid #facc15 !important; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transform: translateY(-2px); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 1rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input, select, button { outline: none; -webkit-appearance: none; }
        .pickup-accent { border-left: 20px solid #3b82f6; }
        .dropoff-accent { border-left: 20px solid #ef4444; }
    </style>
</head>
<body class="pb-40 overflow-x-hidden">

<div id="app" class="max-w-xl mx-auto bg-white min-h-screen relative shadow-2xl">
    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-xl font-black italic tracking-tighter">🚐 BUS-MASTER <span class="text-[10px] not-italic bg-blue-500 px-2 rounded">LIVE</span></h1>
            <div class="admin-ui flex gap-2">
                <button id="seed-btn" class="bg-emerald-500 text-white px-3 py-2 rounded-xl text-[10px] font-black shadow-lg hidden">데이터 초기화</button>
                <button onclick="ui.openAddModal()" class="bg-yellow-400 text-slate-900 px-4 py-2 rounded-2xl font-black text-xs shadow-lg active:scale-95">+ 학생 추가</button>
            </div>
        </div>
        <div id="admin-bus-selector" class="admin-ui grid grid-cols-3 gap-2 mb-5">
            <button onclick="state.setBus('1')" class="bus-btn-1 py-2 rounded-xl bg-slate-800 text-xs font-bold transition-all">1호차</button>
            <button onclick="state.setBus('2')" class="bus-btn-2 py-2 rounded-xl bg-slate-800 text-xs font-bold transition-all">2호차</button>
            <button onclick="state.setBus('3')" class="bus-btn-3 py-2 rounded-xl bg-slate-800 text-xs font-bold transition-all">3호차</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="state.setView('pickup')" id="btn-pickup" class="py-5 rounded-[2rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent transition-all">🏠 승차 명단</button>
            <button onclick="state.setView('dropoff')" id="btn-dropoff" class="py-5 rounded-[2rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent transition-all">🏫 하차 명단</button>
        </div>
    </header>

    <!-- 요일 필터 -->
    <div class="flex gap-1 p-3 overflow-x-auto bg-white/90 no-scrollbar border-b sticky top-[215px] z-40">
        <button onclick="state.setDay('월')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">월</button>
        <button onclick="state.setDay('화')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">화</button>
        <button onclick="state.setDay('수')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">수</button>
        <button onclick="state.setDay('목')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">목</button>
        <button onclick="state.setDay('금')" class="day-btn flex-1 min-w-[55px] py-3 rounded-2xl font-black text-slate-300">금</button>
    </div>

    <!-- 정보 바 -->
    <div class="px-6 py-5 flex justify-between items-end">
        <div>
            <span id="info-bus" class="text-3xl font-black text-slate-900 tracking-tighter">1호차</span>
            <span id="info-day" class="text-sm font-bold text-slate-400 ml-2 italic">요일</span>
        </div>
        <div id="info-count" class="bg-slate-900 text-white px-3 py-1 rounded-full text-[10px] font-black shadow-md">0명</div>
    </div>

    <!-- 메인 리스트 -->
    <main id="main-list" class="p-4 min-h-[400px]"></main>

    <!-- 관리자 하단 바 -->
    <footer id="admin-footer" class="admin-ui fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md border-t max-w-xl mx-auto flex gap-2 z-50 rounded-t-[3rem] shadow-2xl">
        <button onclick="ui.copyLink('1')" id="copy-btn-1" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">1호차 링크</button>
        <button onclick="ui.copyLink('2')" id="copy-btn-2" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">2호차 링크</button>
        <button onclick="ui.copyLink('3')" id="copy-btn-3" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">3호차 링크</button>
    </footer>

    <!-- 모달: 학생 추가/수정 -->
    <div id="modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[3.5rem] overflow-hidden flex flex-col shadow-2xl max-h-[90vh]">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center sticky top-0 z-10">
                <span id="modal-title" class="text-xl font-black italic uppercase">Add Student</span>
                <button onclick="ui.closeModal()" class="text-2xl">&times;</button>
            </div>
            <form id="student-form" class="p-8 space-y-5 overflow-y-auto no-scrollbar pb-10">
                <input type="hidden" id="f-id">
                <input type="text" id="f-name" class="w-full p-5 bg-slate-100 rounded-3xl font-black text-xl" placeholder="학생 성함">
                <div class="grid grid-cols-2 gap-3">
                    <select id="f-bus" class="p-4 bg-slate-100 rounded-2xl font-bold">
                        <option value="1">1호차</option><option value="2">2호차</option><option value="3">3호차</option>
                    </select>
                    <select id="f-day" class="p-4 bg-slate-100 rounded-2xl font-bold">
                        <option value="월">월요일</option><option value="화">화요일</option><option value="수">수요일</option><option value="목">목요일</option><option value="금">금요일</option>
                    </select>
                </div>
                <div class="p-5 bg-blue-50 rounded-[2.5rem] space-y-2 border border-blue-100 shadow-inner">
                    <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest italic">🏠 Pickup</span>
                    <div class="flex gap-2">
                        <input type="time" id="f-pTime" class="w-2/5 p-3 rounded-xl font-black text-lg border-none shadow-sm">
                        <input type="text" id="f-pLoc" class="w-3/5 p-3 rounded-xl font-bold text-sm border-none shadow-sm" placeholder="장소">
                    </div>
                </div>
                <div class="p-5 bg-red-50 rounded-[2.5rem] space-y-2 border border-red-100 shadow-inner">
                    <span class="text-[10px] font-black text-red-500 uppercase tracking-widest italic">🏫 Dropoff</span>
                    <div class="flex gap-2">
                        <input type="time" id="f-dTime" class="w-2/5 p-3 rounded-xl font-black text-lg border-none shadow-sm">
                        <input type="text" id="f-dLoc" class="w-3/5 p-3 rounded-xl font-bold text-sm border-none shadow-sm" placeholder="장소">
                    </div>
                </div>
                <div class="space-y-2">
                    <input type="tel" id="tel-보호자" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="보호자 번호">
                    <input type="tel" id="tel-학생" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="학생 번호">
                    <input type="tel" id="tel-돌봄" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="돌봄 번호">
                    <input type="tel" id="tel-타학원" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="타학원 번호">
                </div>
            </form>
            <div class="p-8 bg-slate-50 border-t sticky bottom-0">
                <button onclick="dbActions.save()" class="w-full bg-slate-900 text-white py-5 rounded-[2.5rem] font-black text-lg shadow-xl active:scale-95 italic transition-all">SAVE CHANGES</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 환경 설정 ---
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'bus-master-live-final-v5';

    // 사진 데이터 내장
    const SNAPSHOT_DATA = [
        {"id":"w1","name":"이하니","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:56","dLoc":"아테라","contacts":[]},
        {"id":"w2","name":"이준일","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:57","dLoc":"수자인센트럴","contacts":[]},
        {"id":"w3","name":"안다온","bus":"1","day":"월","pTime":"14:03","pLoc":"수자인더퍼스트","dTime":"16:02","dLoc":"수자인더퍼스트","contacts":[]},
        {"id":"f1","name":"정세윤","bus":"2","day":"금","pTime":"14:02","pLoc":"17단지","dTime":"15:44","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-3350-2166"}]}
    ];

    // 상태 관리 객체
    window.state = {
        students: [],
        currentBus: "1",
        currentDay: "월",
        currentView: "pickup",
        isDriverMode: false,
        user: null,

        setBus(b) { this.currentBus = b; render(); },
        setDay(d) { this.currentDay = d; render(); },
        setView(v) { this.currentView = v; render(); }
    };

    // UI 제어 객체
    window.ui = {
        openAddModal() {
            document.getElementById('student-form').reset();
            document.getElementById('f-id').value = '';
            document.getElementById('f-bus').value = state.currentBus;
            document.getElementById('f-day').value = state.currentDay;
            document.getElementById('modal-title').innerText = "Add Student";
            document.getElementById('modal').style.display = 'flex';
        },
        openEditModal(id) {
            const s = state.students.find(item => item.id === id);
            if (!s) return;
            document.getElementById('f-id').value = s.id;
            document.getElementById('f-name').value = s.name;
            document.getElementById('f-bus').value = s.bus;
            document.getElementById('f-day').value = s.day;
            document.getElementById('f-pTime').value = s.pTime;
            document.getElementById('f-pLoc').value = s.pLoc;
            document.getElementById('f-dTime').value = s.dTime;
            document.getElementById('f-dLoc').value = s.dLoc;
            ["보호자", "학생", "돌봄", "타학원"].forEach(cat => {
                const c = (s.contacts || []).find(ci => ci.cat === cat);
                document.getElementById(`tel-${cat}`).value = c ? c.tel : '';
            });
            document.getElementById('modal-title').innerText = "Edit Student";
            document.getElementById('modal').style.display = 'flex';
        },
        closeModal() { document.getElementById('modal').style.display = 'none'; },
        copyLink(busNum) {
            const baseUrl = window.location.href.split('?')[0];
            const link = `${baseUrl}?bus=${busNum}&mode=driver`;
            const el = document.createElement('textarea');
            el.value = link; document.body.appendChild(el); el.select();
            document.execCommand('copy'); document.body.removeChild(el);
            
            const btn = document.getElementById(`copy-btn-${busNum}`);
            const originalText = btn.innerText;
            btn.innerText = "COPIED! ✅";
            btn.style.backgroundColor = "#10b981";
            setTimeout(() => { btn.innerText = originalText; btn.style.backgroundColor = "#0f172a"; }, 2000);
        }
    };

    // DB 연동 객체
    window.dbActions = {
        async save() {
            if (!state.user) return;
            const name = document.getElementById('f-name').value;
            if (!name) return;
            const id = document.getElementById('f-id').value || "id-" + Date.now();
            const contacts = [];
            ["보호자", "학생", "돌봄", "타학원"].forEach(cat => {
                const tel = document.getElementById(`tel-${cat}`).value;
                if (tel) contacts.push({ cat, tel });
            });
            const data = {
                id, name, contacts,
                bus: document.getElementById('f-bus').value,
                day: document.getElementById('f-day').value,
                pTime: document.getElementById('f-pTime').value,
                pLoc: document.getElementById('f-pLoc').value,
                dTime: document.getElementById('f-dTime').value,
                dLoc: document.getElementById('f-dLoc').value
            };
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), data);
                ui.closeModal();
            } catch (err) { console.error("Save failed:", err); }
        },
        async delete(id) {
            if (!state.user || !confirm("삭제하시겠습니까?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
            } catch (err) { console.error("Delete failed:", err); }
        },
        async seed() {
            if (!state.user || state.students.length > 0) return;
            const batch = writeBatch(db);
            SNAPSHOT_DATA.forEach(s => {
                batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), s);
            });
            await batch.commit();
        }
    };

    // 초기화 함수
    async function initialize() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('bus')) state.currentBus = params.get('bus');
        if (params.get('mode') === 'driver') state.isDriverMode = true;

        if (state.isDriverMode) {
            document.body.classList.add('driver-mode');
            document.querySelectorAll('.admin-ui').forEach(el => el.style.display = 'none');
        }

        // 요일 설정
        const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
        if(['월','화','수','목','금'].includes(today)) state.currentDay = today;

        // [Rule 3] 인증을 먼저 수행하고 완료를 기다림
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = user;
                    // 인증이 확실히 완료된 후 리스너 시작
                    const col = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    onSnapshot(col, (snapshot) => {
                        state.students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        const seedBtn = document.getElementById('seed-btn');
                        if (seedBtn) seedBtn.style.display = (state.students.length === 0 && !state.isDriverMode) ? 'block' : 'none';
                        render();
                    }, (error) => {
                        console.error("Firestore Permission Error:", error);
                    });
                }
            });
        } catch (e) {
            console.error("Auth initialization failed:", e);
        }
    }

    function render() {
        const list = document.getElementById('main-list');
        if (!list) return;
        list.innerHTML = '';
        
        const filtered = state.students.filter(s => s.bus === state.currentBus && s.day.includes(state.currentDay))
            .sort((a, b) => {
                const tA = state.currentView === 'pickup' ? a.pTime : a.dTime;
                const tB = state.currentView === 'pickup' ? b.pTime : b.dTime;
                return (tA || "99:99").localeCompare(tB || "99:99");
            });

        filtered.forEach(s => {
            const time = state.currentView === 'pickup' ? s.pTime : s.dTime;
            const loc = state.currentView === 'pickup' ? s.pLoc : s.dLoc;
            const accentClass = state.currentView === 'pickup' ? 'pickup-accent' : 'dropoff-accent';
            const textAccent = state.currentView === 'pickup' ? 'text-blue-600' : 'text-red-600';
            
            const card = document.createElement('div');
            card.className = `bg-white rounded-[2.5rem] shadow-xl ${accentClass} p-6 mb-5 animate-in fade-in slide-in-from-bottom-2`;
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-4xl font-black text-slate-900 tracking-tight">${s.name}</h2>
                        <p class="text-[10px] font-bold uppercase mt-1 ${textAccent}">${state.currentView === 'pickup' ? '🏠 승차단계' : '🏫 하차단계'}</p>
                    </div>
                    <div class="admin-ui flex gap-1 ${state.isDriverMode ? 'hidden' : ''}">
                        <button onclick="ui.openEditModal('${s.id}')" class="p-2 opacity-30 text-2xl">📝</button>
                        <button onclick="dbActions.delete('${s.id}')" class="p-2 opacity-30 text-2xl">🗑️</button>
                    </div>
                </div>
                <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-3xl mb-4 shadow-inner">
                    <span class="text-4xl font-black font-mono leading-none ${textAccent}">${time || '--:--'}</span>
                    <span class="text-xl font-bold text-slate-700 flex-1 break-keep">${loc || '장소 미입력'}</span>
                </div>
                <div class="space-y-2">
                    ${(s.contacts || []).map(c => `
                        <div class="flex items-center justify-between bg-slate-50/50 p-3 rounded-2xl border border-slate-100">
                            <span class="text-[9px] font-black text-slate-400 w-10 uppercase">${c.cat}</span>
                            <div class="flex gap-2">
                                <a href="tel:${c.tel}" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md">📞 전화</a>
                                <a href="sms:${c.tel}" class="bg-emerald-500 text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md">✉️ 문자</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            list.appendChild(card);
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div class="py-20 text-center opacity-10 text-xl font-black italic">NO STUDENTS SCHEDULED</div>`;
        }

        document.getElementById('info-bus').innerText = state.currentBus + "호차";
        document.getElementById('info-day').innerText = state.currentDay + "요일";
        document.getElementById('info-count').innerText = filtered.length + " 명";
        
        document.querySelectorAll('.day-btn').forEach(b => {
            const isActive = b.innerText === state.currentDay;
            b.classList.toggle('bg-yellow-400', isActive);
            b.classList.toggle('text-slate-900', isActive);
        });
        
        document.querySelectorAll('#admin-bus-selector button').forEach(b => {
            const isActive = b.innerText.includes(state.currentBus);
            b.classList.toggle('bg-yellow-400', isActive);
            b.classList.toggle('text-slate-900', isActive);
        });

        document.getElementById('btn-pickup').className = `py-6 rounded-[2.5rem] font-black text-xl flex flex-col items-center border-4 ${state.currentView === 'pickup' ? 'active-tab' : 'bg-slate-800 text-slate-500 border-transparent opacity-60'}`;
        document.getElementById('btn-dropoff').className = `py-6 rounded-[2.5rem] font-black text-xl flex flex-col items-center border-4 ${state.currentView === 'dropoff' ? 'active-tab' : 'bg-slate-800 text-slate-500 border-transparent opacity-60'}`;
    }

    document.getElementById('seed-btn').onclick = dbActions.seed;
    initialize();
</script>
</body>
</html>
