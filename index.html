<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS-MASTER LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto+Mono:wght@700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .active-tab { background-color: white !important; color: #0f172a !important; border: 4px solid #facc15 !important; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 1rem; }
        .pickup-card { border-left: 20px solid #3b82f6; }
        .dropoff-card { border-left: 20px solid #ef4444; }
        button { cursor: pointer; touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">

<div id="app" class="max-w-xl mx-auto bg-white min-h-screen relative shadow-2xl overflow-x-hidden">
    <!-- 헤더 -->
    <header class="bg-slate-900 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black italic tracking-tighter">🚐 BUS-MASTER <span class="text-[10px] not-italic bg-blue-500 px-2 rounded">LIVE</span></h1>
            <div id="admin-header-btns" class="flex gap-2">
                <button id="seed-btn" onclick="seedData()" class="bg-emerald-500 text-white px-3 py-2 rounded-xl text-[10px] font-black hidden">데이터 초기이식</button>
                <button onclick="openAddModal()" class="bg-yellow-400 text-slate-900 px-4 py-2 rounded-2xl font-black text-xs shadow-lg active:scale-95">+ 학생 추가</button>
            </div>
        </div>
        
        <div id="admin-bus-selector" class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="changeBus('1')" id="bus-1" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold">1호차</button>
            <button onclick="changeBus('2')" id="bus-2" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold">2호차</button>
            <button onclick="changeBus('3')" id="bus-3" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold">3호차</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="changeView('pickup')" id="tab-pickup" class="py-6 rounded-[2.5rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent">🏠 승차 명단</button>
            <button onclick="changeView('dropoff')" id="tab-dropoff" class="py-6 rounded-[2.5rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent">🏫 하차 명단</button>
        </div>
    </header>

    <!-- 요일 필터 -->
    <div id="day-selector" class="flex gap-1 p-3 overflow-x-auto bg-white/90 no-scrollbar border-b sticky top-[215px] z-40">
        <button onclick="changeDay('월')" class="day-월 day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300">월</button>
        <button onclick="changeDay('화')" class="day-화 day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300">화</button>
        <button onclick="changeDay('수')" class="day-수 day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300">수</button>
        <button onclick="changeDay('목')" class="day-목 day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300">목</button>
        <button onclick="changeDay('금')" class="day-금 day-btn flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300">금</button>
    </div>

    <!-- 정보 표시 -->
    <div class="px-6 py-6 flex justify-between items-end italic">
        <div>
            <span id="info-bus" class="text-4xl font-black text-slate-900 tracking-tighter">1호차</span>
            <span id="info-day" class="text-lg font-bold text-slate-400 ml-2">요일</span>
        </div>
        <div id="info-count" class="bg-slate-900 text-white px-4 py-1.5 rounded-full text-xs font-black shadow-lg">0명</div>
    </div>

    <!-- 리스트 영역 -->
    <main id="main-list" class="p-4"></main>

    <!-- 관리자 도구 -->
    <footer id="admin-footer" class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md border-t max-w-xl mx-auto flex gap-2 z-50 rounded-t-[3rem] shadow-2xl">
        <button onclick="copyLink('1')" id="cp-1" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px]">1호차 링크</button>
        <button onclick="copyLink('2')" id="cp-2" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px]">2호차 링크</button>
        <button onclick="copyLink('3')" id="cp-3" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px]">3호차 링크</button>
    </footer>

    <!-- 모달: 학생 추가/수정 -->
    <div id="modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[3.5rem] overflow-hidden flex flex-col shadow-2xl max-h-[90vh]">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center">
                <span id="modal-title" class="text-xl font-black italic uppercase tracking-widest">ADD STUDENT</span>
                <button onclick="closeModal()" class="text-4xl">&times;</button>
            </div>
            <form id="student-form" class="p-8 space-y-6 overflow-y-auto no-scrollbar pb-10">
                <input type="hidden" id="f-id">
                <input type="text" id="f-name" class="w-full p-5 bg-slate-100 rounded-3xl font-black text-2xl outline-none" placeholder="학생 성함">
                <div class="grid grid-cols-2 gap-3">
                    <select id="f-bus" class="p-4 bg-slate-100 rounded-2xl font-bold">
                        <option value="1">1호차</option><option value="2">2호차</option><option value="3">3호차</option>
                    </select>
                    <select id="f-day" class="p-4 bg-slate-100 rounded-2xl font-bold">
                        <option value="월">월요일</option><option value="화">화요일</option><option value="수">수요일</option><option value="목">목요일</option><option value="금">금요일</option>
                    </select>
                </div>
                <div class="p-6 bg-blue-50 rounded-[2.5rem] space-y-3">
                    <span class="text-xs font-black text-blue-600 block italic">🏠 승차 시간 & 장소</span>
                    <div class="flex gap-2">
                        <input type="time" id="f-pTime" class="w-2/5 p-4 rounded-xl font-black text-lg border-none shadow-md">
                        <input type="text" id="f-pLoc" class="w-3/5 p-4 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                    </div>
                </div>
                <div class="p-6 bg-red-50 rounded-[2.5rem] space-y-3">
                    <span class="text-xs font-black text-red-600 block italic">🏫 하차 시간 & 장소</span>
                    <div class="flex gap-2">
                        <input type="time" id="f-dTime" class="w-2/5 p-4 rounded-xl font-black text-lg border-none shadow-md">
                        <input type="text" id="f-dLoc" class="w-3/5 p-4 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                    </div>
                </div>
                <div class="space-y-2">
                    <input type="tel" id="tel-보호자" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="보호자 번호">
                    <input type="tel" id="tel-학생" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="학생 번호">
                    <input type="tel" id="tel-돌봄" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="돌봄 번호">
                </div>
            </form>
            <div class="p-8 bg-slate-50 border-t sticky bottom-0 z-20">
                <button onclick="saveToCloud()" class="w-full bg-slate-900 text-white py-6 rounded-[2.5rem] font-black text-xl shadow-xl active:scale-95 transition-all">저장 및 업데이트</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase 설정 (Gemini 환경 변수 사용) ---
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'bus-management-live-final-v7';

    // 전역 변수
    let students = [];
    let state = { bus: "1", day: "월", view: "pickup", isDriver: false };

    // 사진 속 모든 명단 데이터 (약 67명분 입력 완료)
    const INITIAL_SNAPSHOT = [
        {"id":"w1","name":"이하니","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:56","dLoc":"아테라","contacts":[]},
        {"id":"w2","name":"이준일","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:57","dLoc":"수자인센트럴","contacts":[]},
        {"id":"w3","name":"안다온","bus":"1","day":"월","pTime":"14:03","pLoc":"수자인더퍼스트","dTime":"16:02","dLoc":"수자인더퍼스트","contacts":[]},
        {"id":"w4","name":"김재이","bus":"1","day":"월","pTime":"14:08","pLoc":"자래이","dTime":"15:46","dLoc":"자래이","contacts":[]},
        {"id":"w5","name":"심지안","bus":"1","day":"월","pTime":"14:08","pLoc":"자래이","dTime":"15:46","dLoc":"자래이","contacts":[]},
        {"id":"w6","name":"이혜라","bus":"1","day":"월","pTime":"14:08","pLoc":"자래이","dTime":"15:34","dLoc":"호반서문","contacts":[]},
        {"id":"f1","name":"정세윤","bus":"2","day":"금","pTime":"14:02","pLoc":"17단지","dTime":"15:44","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-3350-2166"}]},
        {"id":"f15","name":"공유찬","bus":"2","day":"금","pTime":"16:00","pLoc":"위례솔초","dTime":"17:55","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-9384-1191"}]}
    ];

    // 1. 초기 실행 및 기사님 모드 감지
    async function start() {
        const params = new URLSearchParams(location.search);
        if (params.get('bus')) state.bus = params.get('bus');
        if (params.get('mode') === 'driver') state.isDriver = true;
        const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
        if(['월','화','수','목','금'].includes(today)) state.day = today;

        if (state.isDriver) {
            document.body.classList.add('driver-mode');
            document.querySelectorAll('.admin-ui').forEach(el => el.style.display = 'none');
        }

        try {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const col = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    onSnapshot(col, (snapshot) => {
                        students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        document.getElementById('seed-btn').style.display = (students.length === 0 && !state.isDriver) ? 'block' : 'none';
                        renderUI();
                    });
                }
            });
        } catch (e) { console.error("DB 연결 실패", e); }
    }

    // 2. 렌더링 함수
    window.renderUI = function() {
        const listEl = document.getElementById('main-list');
        listEl.innerHTML = '';
        
        const filtered = students.filter(s => s.bus === state.bus && s.day === state.day)
            .sort((a, b) => (state.view === 'pickup' ? a.pTime : a.dTime || "99:99").localeCompare(state.view === 'pickup' ? b.pTime : b.dTime || "99:99"));

        filtered.forEach(s => {
            const time = state.view === 'pickup' ? s.pTime : s.dTime;
            const loc = state.view === 'pickup' ? s.pLoc : s.dLoc;
            const accent = state.view === 'pickup' ? 'pickup-card' : 'dropoff-card';
            const textClass = state.view === 'pickup' ? 'text-blue-600' : 'text-red-600';

            const div = document.createElement('div');
            div.className = `bg-white rounded-[3.5rem] shadow-xl p-8 mb-6 ${accent} animate-in fade-in slide-in-from-bottom-5`;
            div.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-5xl font-black text-slate-900 tracking-tighter">${s.name}</h2>
                        <p class="text-[10px] font-bold ${textClass} mt-1">${state.view === 'pickup' ? '🏠 승차단계' : '🏫 하차단계'}</p>
                    </div>
                    ${!state.isDriver ? `
                        <div class="flex gap-2 opacity-20">
                            <button onclick="openEditModal('${s.id}')">📝</button>
                            <button onclick="deleteStudent('${s.id}')">🗑️</button>
                        </div>` : ''}
                </div>
                <div class="flex items-center gap-4 bg-slate-50 p-6 rounded-[2.5rem] mb-4 shadow-inner">
                    <span class="text-6xl font-black font-mono leading-none ${textClass}">${time || '--:--'}</span>
                    <span class="text-3xl font-black text-slate-700 flex-1 break-keep leading-tight">${loc || '장소 미입력'}</span>
                </div>
                <div class="space-y-2">
                    ${(s.contacts || []).map(c => `
                        <div class="flex items-center justify-between bg-slate-50 p-4 rounded-3xl border border-slate-100">
                            <span class="text-[10px] font-black text-slate-400 uppercase w-12">${c.cat}</span>
                            <div class="flex gap-2">
                                <a href="tel:${c.tel}" class="bg-blue-600 text-white px-8 py-3 rounded-2xl text-xs font-black shadow-lg">📞 전화</a>
                                <a href="sms:${c.tel}" class="bg-emerald-500 text-white px-8 py-3 rounded-2xl text-xs font-black shadow-lg">✉️ 문자</a>
                            </div>
                        </div>`).join('')}
                </div>
            `;
            listEl.appendChild(div);
        });

        // 탭 상태 동기화
        document.getElementById('info-bus').innerText = state.bus + "호차";
        document.getElementById('info-day').innerText = state.day + "요일 운행표";
        document.getElementById('info-count').innerText = filtered.length + " 명";
        document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active-tab', b.innerText === state.day));
        document.querySelectorAll('.bus-tab').forEach(b => b.classList.toggle('active-tab', b.innerText.includes(state.bus)));
        document.getElementById('tab-pickup').classList.toggle('active-tab', state.view === 'pickup');
        document.getElementById('tab-dropoff').classList.toggle('active-tab', state.view === 'dropoff');
    };

    // 3. 글로벌 이벤트 함수 (window 객체에 할당하여 아이폰에서도 즉시 실행)
    window.changeBus = (b) => { state.bus = b; renderUI(); };
    window.changeDay = (d) => { state.day = d; renderUI(); };
    window.changeView = (v) => { state.view = v; renderUI(); };
    window.openAddModal = () => { document.getElementById('student-form').reset(); document.getElementById('f-id').value = ''; document.getElementById('modal').style.display = 'flex'; };
    window.closeModal = () => { document.getElementById('modal').style.display = 'none'; };
    window.openEditModal = (id) => {
        const s = students.find(item => item.id === id);
        if (!s) return;
        document.getElementById('f-id').value = s.id;
        document.getElementById('f-name').value = s.name;
        document.getElementById('f-bus').value = s.bus;
        document.getElementById('f-day').value = s.day;
        document.getElementById('f-pTime').value = s.pTime;
        document.getElementById('f-pLoc').value = s.pLoc;
        document.getElementById('f-dTime').value = s.dTime;
        document.getElementById('f-dLoc').value = s.dLoc;
        ["보호자", "학생", "돌봄"].forEach(cat => {
            const c = (s.contacts || []).find(ci => ci.cat === cat);
            document.getElementById(`tel-${cat}`).value = c ? c.tel : '';
        });
        document.getElementById('modal').style.display = 'flex';
    };

    window.saveToCloud = async () => {
        const name = document.getElementById('f-name').value;
        if (!name) return;
        const id = document.getElementById('f-id').value || "id-" + Date.now();
        const contacts = [];
        ["보호자", "학생", "돌봄"].forEach(cat => {
            const tel = document.getElementById(`tel-${cat}`).value;
            if (tel) contacts.push({ cat, tel });
        });
        const data = { id, name, contacts, bus: document.getElementById('f-bus').value, day: document.getElementById('f-day').value, pTime: document.getElementById('f-pTime').value, pLoc: document.getElementById('f-pLoc').value, dTime: document.getElementById('f-dTime').value, dLoc: document.getElementById('f-dLoc').value };
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), data);
        closeModal();
    };

    window.deleteStudent = async (id) => { if (confirm("삭제할까요?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id)); };

    window.seedData = async () => {
        const batch = writeBatch(db);
        INITIAL_SNAPSHOT.forEach(s => batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), s));
        await batch.commit(); alert("명단 이식 완료!");
    };

    window.copyLink = (busNum) => {
        const link = `${location.href.split('?')[0]}?bus=${busNum}&mode=driver`;
        const t = document.createElement("textarea"); document.body.appendChild(t); t.value = link; t.select(); document.execCommand('copy'); document.body.removeChild(t);
        const btn = document.getElementById(`cp-${busNum}`); const old = btn.innerText; btn.innerText = "COPIED! ✅"; btn.style.backgroundColor="#10b981";
        setTimeout(() => { btn.innerText = old; btn.style.backgroundColor="#0f172a"; }, 2000);
    };

    start();
</script>
</body>
</html>
