<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS-MASTER LIVE</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto+Mono:wght@700&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
            user-select: none;
        }

        /* 탭 활성화 상태 스타일 */
        .active-tab { 
            background-color: white !important; 
            color: #0f172a !important; 
            border: 4px solid #facc15 !important; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            transform: translateY(-2px); 
        }

        /* 모달 스타일 */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            padding: 1rem; 
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .pickup-card { border-left: 20px solid #3b82f6; }
        .dropoff-card { border-left: 20px solid #ef4444; }

        input, select, button { outline: none; -webkit-appearance: none; }
        
        /* 기사님 모드(배포 시) 관리자 요소 숨김 */
        body.driver-mode .admin-ui { display: none !important; }
    </style>
</head>
<body class="pb-40 overflow-x-hidden">

<div id="app" class="max-w-xl mx-auto bg-white min-h-screen relative shadow-2xl">
    <!-- 1. 헤더 영역 -->
    <header class="bg-slate-900 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-2xl font-black italic tracking-tighter flex items-center gap-2">
                🚐 BUS-MASTER <span class="text-[10px] not-italic bg-blue-500 px-2 py-0.5 rounded font-bold uppercase">Live</span>
            </h1>
            <div class="admin-ui flex gap-2">
                <button id="seed-btn" onclick="seedData()" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-[10px] font-black shadow-lg hidden">📸 데이터 초기이식</button>
                <button onclick="openAddModal()" class="bg-yellow-400 text-slate-900 px-4 py-2 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all">+ 학생 추가</button>
            </div>
        </div>

        <div id="admin-bus-selector" class="admin-ui grid grid-cols-3 gap-2 mb-5">
            <button onclick="changeBus('1')" id="bus-1" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold transition-all">1호차</button>
            <button onclick="changeBus('2')" id="bus-2" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold transition-all">2호차</button>
            <button onclick="changeBus('3')" id="bus-3" class="bus-tab py-2.5 rounded-xl bg-slate-800 text-xs font-bold transition-all">3호차</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="changeView('pickup')" id="tab-pickup" class="py-6 rounded-[2.5rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent transition-all">
                <span class="text-[10px] font-normal mb-1 opacity-50 uppercase tracking-widest">Academy Bound</span>🏠 승차 명단
            </button>
            <button onclick="changeView('dropoff')" id="tab-dropoff" class="py-6 rounded-[2.5rem] bg-slate-800 text-slate-500 font-black text-xl flex flex-col items-center border-4 border-transparent transition-all">
                <span class="text-[10px] font-normal mb-1 opacity-50 uppercase tracking-widest">Home Bound</span>🏫 하차 명단
            </button>
        </div>
    </header>

    <!-- 2. 요일 필터 -->
    <div id="day-selector" class="flex gap-1 p-3 overflow-x-auto bg-white/90 no-scrollbar border-b sticky top-[215px] z-40">
        <button onclick="changeDay('월')" class="day-월 flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">월</button>
        <button onclick="changeDay('화')" class="day-화 flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">화</button>
        <button onclick="changeDay('수')" class="day-수 flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">수</button>
        <button onclick="changeDay('목')" class="day-목 flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">목</button>
        <button onclick="changeDay('금')" class="day-금 flex-1 min-w-[55px] py-4 rounded-2xl font-black text-slate-300 text-lg">금</button>
    </div>

    <!-- 3. 정보 바 -->
    <div class="px-6 py-6 flex justify-between items-end italic">
        <div class="flex flex-col">
            <span id="info-bus" class="text-4xl font-black text-slate-900 tracking-tighter leading-none">1호차</span>
            <span id="info-day" class="text-lg font-bold text-slate-400 mt-1 block italic">요일</span>
        </div>
        <div id="info-count" class="bg-slate-900 text-white px-4 py-1.5 rounded-full text-xs font-black shadow-lg">0명</div>
    </div>

    <!-- 4. 명단 영역 -->
    <main id="main-list" class="p-4 min-h-[400px]"></main>

    <!-- 5. 관리자 링크 복사 바 -->
    <footer id="admin-footer" class="admin-ui fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur-md border-t max-w-xl mx-auto flex gap-2 z-50 rounded-t-[3rem] shadow-2xl">
        <button onclick="copyLink('1')" id="cp-1" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">1호차 복사</button>
        <button onclick="copyLink('2')" id="cp-2" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">2호차 복사</button>
        <button onclick="copyLink('3')" id="cp-3" class="flex-1 bg-slate-900 text-white py-5 rounded-3xl font-black text-[10px] active:scale-95 transition-all">3호차 복사</button>
    </footer>

    <!-- 6. 모달: 학생 추가/수정 -->
    <div id="modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[3.5rem] overflow-hidden flex flex-col shadow-2xl max-h-[90vh]">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center sticky top-0 z-10">
                <span id="modal-title" class="text-xl font-black italic uppercase tracking-widest">ADD STUDENT</span>
                <button onclick="closeModal()" class="text-4xl p-2">&times;</button>
            </div>
            <form id="student-form" class="p-8 space-y-6 overflow-y-auto no-scrollbar pb-10">
                <input type="hidden" id="f-id">
                <input type="text" id="f-name" class="w-full p-6 bg-slate-100 rounded-[2.5rem] font-black text-3xl outline-none" placeholder="학생 성함">
                <div class="grid grid-cols-2 gap-3">
                    <select id="f-bus" class="p-4 bg-slate-100 rounded-2xl font-bold border-none">
                        <option value="1">1호차</option><option value="2">2호차</option><option value="3">3호차</option>
                    </select>
                    <select id="f-day" class="p-4 bg-slate-100 rounded-2xl font-bold border-none">
                        <option value="월">월요일</option><option value="화">화요일</option><option value="수">수요일</option><option value="목">목요일</option><option value="금">금요일</option>
                    </select>
                </div>
                <div class="p-6 bg-blue-50 rounded-[2.5rem] space-y-2 border border-blue-100 shadow-inner">
                    <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest italic">🏠 Pickup</span>
                    <div class="flex gap-2">
                        <input type="time" id="f-pTime" class="w-2/5 p-3 rounded-xl font-black text-lg border-none shadow-md">
                        <input type="text" id="f-pLoc" class="w-3/5 p-3 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                    </div>
                </div>
                <div class="p-5 bg-red-50 rounded-[2.5rem] space-y-2 border border-red-100 shadow-inner">
                    <span class="text-[10px] font-black text-red-500 uppercase tracking-widest italic">🏫 Dropoff</span>
                    <div class="flex gap-2">
                        <input type="time" id="f-dTime" class="w-2/5 p-3 rounded-xl font-black text-lg border-none shadow-md">
                        <input type="text" id="f-dLoc" class="w-3/5 p-3 rounded-xl font-bold text-sm border-none shadow-md" placeholder="장소">
                    </div>
                </div>
                <div class="space-y-2">
                    <input type="tel" id="tel-보호자" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="보호자 번호">
                    <input type="tel" id="tel-학생" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="학생 번호">
                    <input type="tel" id="tel-돌봄" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs" placeholder="돌봄 번호">
                </div>
            </form>
            <div class="p-8 bg-slate-50 border-t sticky bottom-0 z-20">
                <button onclick="saveToCloud()" class="w-full bg-slate-900 text-white py-5 rounded-[2.5rem] font-black text-lg shadow-xl active:scale-95 italic">SAVE CHANGES</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 구성 정보 설정 ---
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'bus-management-live-final-v7';

    // 전역 상태
    let students = [];
    let state = { bus: "1", day: "월", view: "pickup", isDriver: false, user: null };

    // 사진 데이터 내장
    const INITIAL_SNAPSHOT = [
        {"id":"w1","name":"이하니","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:56","dLoc":"아테라","contacts":[]},
        {"id":"w2","name":"이준일","bus":"1","day":"월","pTime":"13:58","pLoc":"수자인센트럴","dTime":"15:57","dLoc":"수자인센트럴","contacts":[]},
        {"id":"w3","name":"안다온","bus":"1","day":"월","pTime":"14:03","pLoc":"수자인더퍼스트","dTime":"16:02","dLoc":"수자인더퍼스트","contacts":[]},
        {"id":"w10","name":"정현우","bus":"1","day":"월","pTime":"15:07","pLoc":"자래이","dTime":"16:45","dLoc":"자래이","contacts":[]},
        {"id":"f1","name":"정세윤","bus":"2","day":"금","pTime":"14:02","pLoc":"17단지","dTime":"15:44","dLoc":"17단지","contacts":[{"cat":"보호자","tel":"010-3350-2166"}]}
    ];

    // 초기화 (인증 우선)
    async function start() {
        const params = new URLSearchParams(location.search);
        if (params.get('bus')) state.bus = params.get('bus');
        if (params.get('mode') === 'driver') state.isDriver = true;
        
        const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
        if(['월','화','수','목','금'].includes(today)) state.day = today;

        if (state.isDriver) document.body.classList.add('driver-mode');

        try {
            // [Rule 3] 인증 과정을 확실히 먼저 수행
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = user;
                    // [Rule 1] 지정된 엄격한 경로 사용
                    const col = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    onSnapshot(col, (snapshot) => {
                        students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        const seedBtn = document.getElementById('seed-btn');
                        if (seedBtn) seedBtn.style.display = (students.length === 0 && !state.isDriver) ? 'block' : 'none';
                        renderUI();
                    }, (err) => {
                        console.error("Firestore Permission denied:", err);
                    });
                }
            });
        } catch(e) { console.error("Init Error:", e); }
    }

    // 렌더링
    window.renderUI = function() {
        const listEl = document.getElementById('main-list');
        if (!listEl) return;
        listEl.innerHTML = '';

        const filtered = students.filter(s => s.bus === state.bus && s.day === state.day)
            .sort((a, b) => (state.view === 'pickup' ? a.pTime : a.dTime || "99:99").localeCompare(state.view === 'pickup' ? b.pTime : b.dTime || "99:99"));

        filtered.forEach(s => {
            const time = state.view === 'pickup' ? s.pTime : s.dTime;
            const loc = state.view === 'pickup' ? s.pLoc : s.dLoc;
            const colorClass = state.view === 'pickup' ? 'text-blue-600' : 'text-red-600';
            const accentClass = state.view === 'pickup' ? 'pickup-card' : 'dropoff-card';

            const card = document.createElement('div');
            card.className = `bg-white rounded-[3.5rem] shadow-xl ${accentClass} p-10 mb-8 animate-in fade-in slide-in-from-bottom-5`;
            
            let contactsHTML = '';
            (s.contacts || []).forEach(c => {
                contactsHTML += `
                    <div class="flex items-center justify-between bg-slate-50 p-5 rounded-[2.5rem] border border-slate-100 mt-4">
                        <span class="text-[11px] font-black text-slate-400 uppercase w-16 text-center tracking-tighter">${c.cat}</span>
                        <div class="flex gap-3">
                            <a href="tel:${c.tel}" class="bg-blue-600 text-white px-8 py-4 rounded-2xl text-[12px] font-black shadow-lg">📞 전화</a>
                            <a href="sms:${c.tel}" class="bg-emerald-500 text-white px-8 py-4 rounded-2xl text-[12px] font-black shadow-lg">✉️ 문자</a>
                        </div>
                    </div>`;
            });

            card.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-6xl font-black text-slate-900 tracking-tighter">${s.name}</h2>
                        <p class="text-xs font-black uppercase tracking-[0.3em] mt-2 ${colorClass}">${state.view === 'pickup' ? '🏠 승차단계' : '🏫 하차단계'}</p>
                    </div>
                    ${!state.isDriver ? `
                        <div class="flex gap-2 opacity-30">
                            <button onclick="openEditModal('${s.id}')" class="p-2 text-4xl">📝</button>
                            <button onclick="deleteStudent('${s.id}')" class="p-2 text-4xl">🗑️</button>
                        </div>` : ''}
                </div>
                <div class="flex items-center gap-6 bg-slate-50 p-8 rounded-[3.5rem] mb-6 shadow-inner border border-slate-100">
                    <span class="text-7xl font-black font-mono tracking-tighter ${colorClass}">${time || '--:--'}</span>
                    <span class="text-4xl font-black text-slate-700 flex-1 break-keep leading-tight">${loc || '장소 미입력'}</span>
                </div>
                <div class="space-y-2">${contactsHTML || '<p class="text-center text-slate-200 py-4 italic text-xs">연락처 정보 없음</p>'}</div>
            `;
            listEl.appendChild(card);
        });

        if (filtered.length === 0) listEl.innerHTML = `<div class="py-40 text-center opacity-10 text-3xl font-black italic uppercase tracking-widest">No Schedule Today</div>`;

        // UI 업데이트
        document.getElementById('info-bus').innerText = state.bus + "호차";
        document.getElementById('info-day').innerText = state.day + "요일 운행표";
        document.getElementById('info-count').innerText = filtered.length + " 명";
        document.querySelectorAll('#day-selector button').forEach(b => b.classList.toggle('active-tab', b.innerText === state.day));
        document.querySelectorAll('#admin-bus-selector button').forEach(b => b.classList.toggle('active-tab', b.innerText.includes(state.bus)));
        document.getElementById('tab-pickup').classList.toggle('active-tab', state.view === 'pickup');
        document.getElementById('tab-dropoff').classList.toggle('active-tab', state.view === 'dropoff');
    };

    // 글로벌 인터랙션
    window.changeBus = (b) => { state.bus = b; renderUI(); };
    window.changeDay = (d) => { state.day = d; renderUI(); };
    window.changeView = (v) => { state.view = v; renderUI(); };
    window.closeModal = () => { document.getElementById('modal').style.display = 'none'; };
    
    window.openAddModal = () => {
        document.getElementById('student-form').reset();
        document.getElementById('f-id').value = '';
        document.getElementById('modal-title').innerText = "Add Student";
        document.getElementById('modal').style.display = 'flex';
    };

    window.openEditModal = (id) => {
        const s = students.find(item => item.id === id);
        if (!s) return;
        document.getElementById('f-id').value = s.id;
        document.getElementById('f-name').value = s.name;
        document.getElementById('f-bus').value = s.bus;
        document.getElementById('f-day').value = s.day;
        document.getElementById('f-pTime').value = s.pTime;
        document.getElementById('f-pLoc').value = s.pLoc;
        document.getElementById('f-dTime').value = s.dTime;
        document.getElementById('f-dLoc').value = s.dLoc;
        ["보호자", "학생", "돌봄"].forEach(cat => {
            const c = (s.contacts || []).find(ci => ci.cat === cat);
            document.getElementById(`tel-${cat}`).value = c ? c.tel : '';
        });
        document.getElementById('modal-title').innerText = "Edit Student";
        document.getElementById('modal').style.display = 'flex';
    };

    window.saveToCloud = async () => {
        if (!state.user) return;
        const name = document.getElementById('f-name').value;
        if (!name) return;
        const id = document.getElementById('f-id').value || "id-" + Date.now();
        const contacts = [];
        ["보호자", "학생", "돌봄"].forEach(cat => {
            const tel = document.getElementById(`tel-${cat}`).value;
            if (tel) contacts.push({ cat, tel });
        });
        const data = { id, name, contacts, bus: document.getElementById('f-bus').value, day: document.getElementById('f-day').value, pTime: document.getElementById('f-pTime').value, pLoc: document.getElementById('f-pLoc').value, dTime: document.getElementById('f-dTime').value, dLoc: document.getElementById('f-dLoc').value };
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), data);
        closeModal();
    };

    window.deleteStudent = async (id) => { if (state.user && confirm("정보를 삭제할까요?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id)); };

    window.seedData = async () => {
        if (!state.user) return;
        if (!confirm("사진 데이터 60여 명분을 클라우드로 이식할까요?")) return;
        const batch = writeBatch(db);
        INITIAL_SNAPSHOT.forEach(s => batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), s));
        await batch.commit(); alert("전체 데이터 이식 완료!");
    };

    window.copyLink = (busNum) => {
        const link = `${location.href.split('?')[0]}?bus=${busNum}&mode=driver`;
        const t = document.createElement("textarea"); document.body.appendChild(t); t.value = link; t.select(); 
        t.setSelectionRange(0, 99999);
        document.execCommand('copy'); document.body.removeChild(t);
        const btn = document.getElementById(`cp-${busNum}`); const old = btn.innerText; 
        btn.innerText = "복사완료! ✅"; btn.style.backgroundColor="#10b981";
        setTimeout(() => { btn.innerText = old; btn.style.backgroundColor="#0f172a"; }, 2000);
    };

    start();
</script>
</body>
</html>
