<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BUS-MASTER Driver</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f8fafc;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f172a;
      color: #fff;
      padding: 20px 16px 18px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin: 0;
      font-style: italic;
    }
    .sub-badge {
      font-size: 11px;
      background: #2563eb;
      color: #fff;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 800;
      white-space: nowrap;
    }
    .view-tabs,
    .day-tabs {
      display: grid;
      gap: 8px;
    }
    .view-tabs {
      grid-template-columns: repeat(2, 1fr);
    }
    .day-wrap {
      position: sticky;
      top: 132px;
      z-index: 90;
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(8px);
      padding: 10px 12px 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .day-tabs {
      grid-template-columns: repeat(5, 1fr);
    }
    .btn {
      border: none;
      cursor: pointer;
      border-radius: 18px;
      font-weight: 900;
      transition: 0.18s ease;
      font-size: 16px;
    }
    .btn:active { transform: scale(0.97); }
    .view-btn {
      background: #1e293b;
      color: rgba(255,255,255,0.35);
      padding: 18px 10px;
      border: 4px solid transparent;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .view-btn small {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .view-btn span {
      font-size: 24px;
      line-height: 1.1;
    }
    .view-btn.active {
      background: #fff;
      color: #0f172a;
      border-color: #facc15;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }
    .day-btn {
      background: #fff;
      color: #94a3b8;
      padding: 12px 6px;
      border: 1px solid #e2e8f0;
      font-size: 18px;
    }
    .day-btn.active {
      background: #facc15;
      color: #0f172a;
      border-color: #eab308;
      box-shadow: 0 6px 16px rgba(250, 204, 21, 0.28);
    }
    .info-bar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 16px 8px;
    }
    .info-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bus-name {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.05em;
      font-style: italic;
      line-height: 1;
    }
    .day-name {
      color: #64748b;
      font-size: 18px;
      font-weight: 800;
    }
    .count-pill {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }
    .main {
      padding: 12px 12px 40px;
    }
    .card {
      background: #fff;
      border-radius: 28px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid #eef2f7;
    }
    .card.pickup { border-left: 14px solid #2563eb; }
    .card.dropoff { border-left: 14px solid #ef4444; }
    .card-body { padding: 22px 18px 18px; }
    .name {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin: 0 0 6px;
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .stage.pickup { color: #2563eb; }
    .stage.pickup .dot { background: #2563eb; }
    .stage.dropoff { color: #ef4444; }
    .stage.dropoff .dot { background: #ef4444; }
    .time-box {
      background: #f8fafc;
      border-radius: 22px;
      padding: 18px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }
    .time {
      font-size: 44px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }
    .time.pickup { color: #2563eb; }
    .time.dropoff { color: #ef4444; }
    .loc {
      flex: 1;
      min-width: 140px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #1e293b;
      word-break: keep-all;
    }
    .contact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 12px;
      margin-top: 10px;
    }
    .contact-label {
      width: 54px;
      text-align: center;
      color: #64748b;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: -0.02em;
      flex: 0 0 auto;
    }
    .contact-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .action-link {
      text-decoration: none;
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 84px;
    }
    .call { background: #2563eb; }
    .sms { background: #10b981; }
    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 80px 20px 120px;
    }
    .empty .emoji {
      font-size: 56px;
      opacity: 0.35;
      margin-bottom: 12px;
    }
    .empty .txt {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .denied {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #f8fafc;
    }
    .denied-box {
      background: white;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(15,23,42,0.08);
      border-radius: 28px;
      padding: 36px 24px;
      width: 100%;
      max-width: 420px;
    }
    .denied-box h1 {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .denied-box p {
      margin: 0;
      color: #64748b;
      font-weight: 700;
      line-height: 1.6;
    }
    @media (max-width: 560px) {
      .title { font-size: 24px; }
      .day-wrap { top: 132px; }
      .bus-name { font-size: 34px; }
      .day-name { font-size: 16px; }
      .name { font-size: 24px; }
      .time { font-size: 38px; }
      .loc { font-size: 24px; }
      .view-btn span { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-VoWAnSd6Rb8CLcJZKQL0ZGKe0wNRjh0",
      authDomain: "bus-master-77c2d.firebaseapp.com",
      projectId: "bus-master-77c2d",
      storageBucket: "bus-master-77c2d.firebasestorage.app",
      messagingSenderId: "1078854736324",
      appId: "1:1078854736324:web:0a7b7496a759445af92c91"
    };

    const DRIVER_KEYS = {
      "1": "bus1-2026-a9K2mP",
      "2": "bus2-2026-b7Q4xR",
      "3": "bus3-2026-c5N8vT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const currentBus = params.get("bus");
    const currentKey = params.get("key");
    const DAYS = ["월", "화", "수", "목", "금"];
    const today = ["일","월","화","수","목","금","토"][new Date().getDay()];
    let currentDay = DAYS.includes(today) ? today : "월";
    let currentView = params.get("view") === "dropoff" ? "dropoff" : "pickup";
    let students = [];

    const appEl = document.getElementById("app");

    function isAllowed() {
      if (!["1", "2", "3"].includes(currentBus)) return false;
      if (!currentKey) return false;
      return DRIVER_KEYS[currentBus] === currentKey;
    }

    function updateUrl() {
      const url = new URL(window.location.href);
      url.searchParams.set("bus", currentBus);
      url.searchParams.set("key", currentKey);
      url.searchParams.set("view", currentView);
      history.replaceState({}, "", url.toString());
    }

    function renderDenied() {
      appEl.innerHTML = `
        <div class="denied">
          <div class="denied-box">
            <h1>접근 권한이 없습니다</h1>
            <p>기사님 전용 링크로 다시 접속해 주세요.</p>
          </div>
        </div>
      `;
    }

    function makeContactHtml(contacts) {
      if (!contacts || contacts.length === 0) return "";
      return contacts.map(c => `
        <div class="contact">
          <div class="contact-label">${c.cat || ""}</div>
          <div class="contact-actions">
            <a class="action-link call" href="tel:${c.tel}">📞 전화</a>
            <a class="action-link sms" href="sms:${c.tel}">✉️ 문자</a>
          </div>
        </div>
      `).join("");
    }

    function render() {
      updateUrl();

      const filtered = students
        .filter(item => item.day === currentDay)
        .sort((a, b) => {
          const ta = currentView === "pickup" ? (a.pTime || "99:99") : (a.dTime || "99:99");
          const tb = currentView === "pickup" ? (b.pTime || "99:99") : (b.dTime || "99:99");
          return ta.localeCompare(tb);
        });

      appEl.innerHTML = `
        <div class="app">
          <header class="header">
            <div class="title-row">
              <h1 class="title">🚐 BUS-MASTER</h1>
              <div class="sub-badge">DRIVER</div>
            </div>

            <div class="view-tabs" id="viewTabs">
              <button class="btn view-btn ${currentView === "pickup" ? "active" : ""}" data-view="pickup">
                <small>Academy Bound</small>
                <span>🏠 승차 명단</span>
              </button>
              <button class="btn view-btn ${currentView === "dropoff" ? "active" : ""}" data-view="dropoff">
                <small>Home Bound</small>
                <span>🏫 하차 명단</span>
              </button>
            </div>
          </header>

          <div class="day-wrap">
            <div class="day-tabs" id="dayTabs">
              ${DAYS.map(day => `
                <button class="btn day-btn ${day === currentDay ? "active" : ""}" data-day="${day}">
                  ${day}
                </button>
              `).join("")}
            </div>
          </div>

          <section class="info-bar">
            <div class="info-main">
              <div class="bus-name">${currentBus}호차</div>
              <div class="day-name">${currentDay}요일 운행 명단</div>
            </div>
            <div class="count-pill">${filtered.length}명</div>
          </section>

          <main class="main">
            ${
              filtered.length === 0
                ? `
                  <div class="empty">
                    <div class="emoji">💤</div>
                    <div class="txt">No Schedule Today</div>
                  </div>
                `
                : filtered.map(item => {
                    const time = currentView === "pickup" ? item.pTime : item.dTime;
                    const loc = currentView === "pickup" ? item.pLoc : item.dLoc;
                    const modeClass = currentView === "pickup" ? "pickup" : "dropoff";
                    const stageText = currentView === "pickup" ? "🏠 승차단계" : "🏫 하차단계";

                    return `
                      <section class="card ${modeClass}">
                        <div class="card-body">
                          <h2 class="name">${item.name || ""}</h2>
                          <div class="stage ${modeClass}">
                            <span class="dot"></span>
                            <span>${stageText}</span>
                          </div>

                          <div class="time-box">
                            <div class="time ${modeClass}">${time || "--:--"}</div>
                            <div class="loc">${loc || "미입력"}</div>
                          </div>

                          ${makeContactHtml(item.contacts)}
                        </div>
                      </section>
                    `;
                  }).join("")
            }
          </main>
        </div>
      `;

      document.querySelectorAll("[data-view]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentView = btn.dataset.view;
          render();
        });
      });

      document.querySelectorAll("[data-day]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentDay = btn.dataset.day;
          render();
        });
      });
    }

    if (!isAllowed()) {
      renderDenied();
    } else {
      const q = query(collection(db, "students"), where("bus", "==", currentBus));
      onSnapshot(q, (snapshot) => {
        students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      }, (error) => {
        console.error(error);
        appEl.innerHTML = `
          <div class="denied">
            <div class="denied-box">
              <h1>데이터를 불러오지 못했습니다</h1>
              <p>Firestore 설정 또는 보안 규칙을 확인해 주세요.</p>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
